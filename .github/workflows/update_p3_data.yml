name: 自动更新排列三数据

on:
  schedule:
    # 每天北京时间上午10点自动运行 (UTC时间凌晨2点)
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许你手动在网页上点按钮触发测试

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v3

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pandas requests lxml html5lib beautifulsoup4 akshare

      - name: 运行抓取脚本
        run: python fetch_p3_data.py

      - name: 提交并推送更新后的数据
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/p3.csv
          git commit -m "Auto update p3 data $(date +'%Y-%m-%d')" || exit 0
          git push
